name: Auto Clock-Out

on:
  schedule:
    # Runs every hour at :00. GitHub Actions free tier supports this.
    - cron: '0 * * * *'
  workflow_dispatch: # allow manual trigger from GitHub UI

jobs:
  clockout:
    runs-on: ubuntu-latest
    steps:
      - name: Call auto clock-out endpoint
        run: |
          response=$(curl -s -w "\n%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://orbitconstructions.vercel.app/api/cron/auto-clockout)
          code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | sed '$d')
          echo "Status: $code"
          echo "Body: $body"
          if [ "$code" != "200" ]; then
            echo "Unexpected status code: $code"
            exit 1
          fi
